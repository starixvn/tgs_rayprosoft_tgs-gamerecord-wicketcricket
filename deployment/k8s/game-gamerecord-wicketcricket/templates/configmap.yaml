apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wicketcricket.fullname" . }}
  labels:
    {{- include "game-gamerecord-wicketcricket.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.GameRecord.WicketCricket.Messages": "Information",
          "Tgs.GameRecord.WicketCricket.Core.ApplicationServices.HandleRecordCommandService": "Information"
        }
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-wicketcricket:9090/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]